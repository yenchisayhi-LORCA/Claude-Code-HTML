<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>林小琪的大小事</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5FD1">

<!-- iOS "加入主畫面" 設定：直接用主畫面圖示開啟、不顯示網址列 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="林小琪的大小事">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2F5FD1;
    --blue-dark:#1E3A8A;
    --teal:#12B8A0;
    --yellow:#F5B700;
    --coral:#FF5A3C;
    --pink:#F03E7A;
    --cream:#FFF9EF;
    --card:#FFFFFF;
    --line:#E4E9F5;
    --text:#28305A;
    --text-soft:#727DA3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--blue);
    font-family:'Mochiy Pop P One','Nunito','PingFang TC','Heiti TC','Microsoft JhengHei',sans-serif;
    font-size:18px;
    color:var(--text);
    overflow-x:hidden;
    padding-bottom:40px;
  }
  h1,h2,.brand-font{font-family:inherit;}

  /* decorative background blobs — big overlapping shapes on a solid blue backdrop */
  .bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .bg-decor span{position:absolute;border-radius:50%;opacity:.95;}
  .bg-decor .b2{width:520px;height:260px;background:var(--teal);top:-70px;left:-60px;}
  .bg-decor .b3{width:460px;height:460px;background:var(--yellow);bottom:-210px;right:-150px;}
  .bg-decor .b4{width:420px;height:420px;background:var(--coral);bottom:-170px;left:-150px;}

  .app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 14px 0;}

  .card{
    background:var(--card);
    border-radius:24px;
    box-shadow:0 8px 24px rgba(30,58,138,.14);
    padding:16px 16px 18px;
    margin-bottom:14px;
    position:relative;
  }

  /* header */
  .header-card{display:flex;align-items:center;gap:14px;}
  .title-icon-img{width:54px;height:54px;border-radius:16px;object-fit:cover;flex:0 0 auto;box-shadow:0 3px 8px rgba(30,58,138,.2);}
  .header-card h1{margin:0;font-size:26px;color:var(--blue-dark);}

  /* add form */
  .add-card form{display:flex;flex-direction:column;gap:8px;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;min-width:0;}
  input,select{
    font-family:inherit;font-size:20px;color:var(--text);
    background:var(--cream);border:2px solid transparent;border-radius:12px;
    padding:11px 12px;outline:none;width:100%;
  }
  input:focus,select:focus{border-color:var(--teal);}
  .add-row1 input[type="date"]{flex:0 0 168px;}
  .add-row1 input[type="text"]{flex:1;}
  .btn-add{
    font-family:inherit;font-weight:700;font-size:20px;color:#fff;
    background:var(--blue);border:none;border-radius:12px;padding:12px 16px;cursor:pointer;
    box-shadow:0 4px 0 #1d3f96;transition:transform .05s;
  }
  .btn-add:active{transform:translateY(2px);box-shadow:0 2px 0 #1d3f96;}

  /* list */
  .list-title{display:flex;align-items:center;justify-content:space-between;margin:2px 6px 10px;}
  .list-title h2{margin:0;font-size:20px;color:var(--blue-dark);display:flex;align-items:center;gap:7px;}
  .list-title h2 svg{width:22px;height:22px;flex:0 0 auto;}
  .list-title button{
    font-family:inherit;font-size:16px;color:var(--text-soft);background:#fff;
    border:2px solid var(--line);border-radius:12px;padding:6px 11px;cursor:pointer;
  }

  .task-row{
    display:flex;align-items:flex-start;gap:10px;border-radius:16px;
    padding:13px 13px;margin-bottom:10px;box-shadow:0 3px 10px rgba(30,58,138,.08);
    transition:opacity .2s;
  }
  .task-row.done{opacity:.6;}
  .checkbox{
    flex:0 0 auto;width:34px;height:34px;border-radius:50%;
    border:2.5px solid #999;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:19px;background:#fff;transition:transform .15s;margin-top:1px;
  }
  .checkbox:active{transform:scale(.85);}
  .checkbox.checked{color:#fff;}
  .row-content{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .row-date{flex:0 0 auto;font-size:16px;font-weight:700;padding:2px 10px;border-radius:9px;background:rgba(255,255,255,.65);white-space:nowrap;}
  .row-date.overdue{background:var(--coral);color:#fff;}
  .task-row.overdue{border:2px solid var(--coral);}
  .row-text{flex:1 1 120px;font-size:20px;font-weight:700;word-break:break-word;color:var(--text);}
  .task-row.done .row-text{text-decoration:line-through;color:var(--text-soft);}
  .row-actions{display:flex;gap:4px;flex:0 0 auto;}
  .icon-btn{
    border:none;background:rgba(255,255,255,.65);width:34px;height:34px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;
  }
  .icon-btn svg{width:18px;height:18px;display:block;}

  .empty-state{text-align:center;padding:36px 10px;color:#EAF0FF;font-size:19px;}
  .empty-state .emoji{font-size:56px;display:block;margin-bottom:8px;}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(30,58,138,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;}
  .modal-backdrop[hidden]{display:none;}
  .modal-sheet{background:#fff;border-radius:22px 22px 0 0;padding:18px 16px 22px;width:100%;max-width:480px;box-shadow:0 -6px 20px rgba(0,0,0,.15);}
  .modal-sheet h2{margin:0 0 10px;font-size:22px;color:var(--blue-dark);}
  .modal-sheet p{margin:0 0 16px;font-size:18px;color:var(--text);line-height:1.5;}
  .modal-sheet .row{margin-bottom:8px;}
  .modal-btns{display:flex;gap:8px;margin-top:10px;}
  .modal-btns button{flex:1;font-family:inherit;font-weight:700;font-size:18px;border:none;border-radius:12px;padding:11px;cursor:pointer;}
  .btn-save{background:var(--teal);color:#fff;}
  .btn-cancel{background:var(--cream);color:var(--text-soft);}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--blue-dark);color:#fff;padding:10px 18px;border-radius:16px;
    font-size:18px;z-index:30;box-shadow:0 6px 16px rgba(0,0,0,.2);
    display:flex;align-items:center;gap:8px;
  }
  .toast button{background:none;border:none;color:var(--yellow);font-weight:800;cursor:pointer;font-size:17px;}
  .toast[hidden]{display:none;}
</style>
</head>
<body>
  <div class="bg-decor"><span class="b2"></span><span class="b3"></span><span class="b4"></span></div>

  <div class="app">
    <header class="card header-card">
      <img class="title-icon-img" src="icons/icon-192.png" alt="">
      <h1>林小琪的大小事</h1>
    </header>

    <section class="card add-card">
      <form id="addForm">
        <div class="row add-row1">
          <input type="date" id="taskDate" />
          <input type="text" id="taskText" placeholder="輸入要做的事情..." maxlength="80" required />
        </div>
        <button type="submit" class="btn-add">➕ 新增事項</button>
      </form>
    </section>

    <div class="list-title">
      <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg> 事項列表</h2>
      <button id="hideDoneBtn">隱藏已完成</button>
    </div>

    <section id="taskListWrap"></section>

    <div id="emptyState" class="empty-state" hidden>
      <span class="emoji">📝</span>
      <div id="emptyText">還沒有任何事項，新增一個開始吧！</div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <div class="modal-backdrop" id="reminderModal" hidden>
    <div class="modal-sheet">
      <h2>⏰ 提醒</h2>
      <p id="reminderMsg"></p>
      <div class="modal-btns">
        <button class="btn-save" id="reminderCloseBtn" type="button">知道了</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="editModal" hidden>
    <div class="modal-sheet">
      <h2>✏️ 編輯事項</h2>
      <div class="row"><input type="date" id="editDate" /></div>
      <div class="row"><input type="text" id="editText" maxlength="80" /></div>
      <div class="modal-btns">
        <button class="btn-cancel" id="editCancelBtn" type="button">取消</button>
        <button class="btn-save" id="editSaveBtn" type="button">儲存</button>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "todoList.tasks.v2";
  var HIDE_DONE_KEY = "todoList.hideDone.v2";

  var WEEKDAYS = ["週日","週一","週二","週三","週四","週五","週六"];

  // outline-style icons (thin stroke, rounded caps) to match the line-icon look
  var ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>';
  var ICON_DELETE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';

  // bright pastel row colors, each paired with a saturated accent for the
  // checkbox / date chip so every row reads as a distinct colour block
  var PALETTE = [
    { bg:"#DCEAFB", accent:"#2F5FD1" },
    { bg:"#D2F5EE", accent:"#0E9C86" },
    { bg:"#FFF2C2", accent:"#D99A00" },
    { bg:"#FFE1D6", accent:"#E8562F" },
    { bg:"#FDE0EC", accent:"#E23E7A" }
  ];

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function toDateStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayStr(){ return toDateStr(new Date()); }
  function parseDateStr(s){
    var parts = s.split("-").map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  function addDays(dateStr, n){
    var d = parseDateStr(dateStr);
    d.setDate(d.getDate()+n);
    return toDateStr(d);
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

  function loadTasks(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ return []; }
  }
  function saveTasks(t){ localStorage.setItem(STORAGE_KEY, JSON.stringify(t)); }
  function loadHideDone(){ return localStorage.getItem(HIDE_DONE_KEY) === "1"; }
  function saveHideDone(v){ localStorage.setItem(HIDE_DONE_KEY, v ? "1" : "0"); }

  var tasks = loadTasks();
  var hideDone = loadHideDone();
  var pendingDelete = null;
  var editingId = null;

  var els = {
    addForm: document.getElementById("addForm"),
    taskDate: document.getElementById("taskDate"),
    taskText: document.getElementById("taskText"),
    hideDoneBtn: document.getElementById("hideDoneBtn"),
    taskListWrap: document.getElementById("taskListWrap"),
    emptyState: document.getElementById("emptyState"),
    emptyText: document.getElementById("emptyText"),
    toast: document.getElementById("toast"),
    editModal: document.getElementById("editModal"),
    editDate: document.getElementById("editDate"),
    editText: document.getElementById("editText"),
    editSaveBtn: document.getElementById("editSaveBtn"),
    editCancelBtn: document.getElementById("editCancelBtn"),
    reminderModal: document.getElementById("reminderModal"),
    reminderMsg: document.getElementById("reminderMsg"),
    reminderCloseBtn: document.getElementById("reminderCloseBtn")
  };

  els.taskDate.value = todayStr();

  function init(){
    updateHideDoneBtn();
    render();
    bindEvents();
    checkReminders();
  }

  function checkReminders(){
    var today = todayStr();
    var overdueCount = tasks.filter(function(t){ return !t.done && t.date < today; }).length;
    var todayCount = tasks.filter(function(t){ return !t.done && t.date === today; }).length;
    if(overdueCount === 0 && todayCount === 0) return;

    var parts = [];
    if(todayCount > 0) parts.push("今天有 "+todayCount+" 件事要做");
    if(overdueCount > 0) parts.push(overdueCount+" 件已經過期了");
    els.reminderMsg.textContent = parts.join("，")+"，記得處理一下喔！";
    els.reminderModal.hidden = false;
  }

  function updateHideDoneBtn(){
    els.hideDoneBtn.textContent = hideDone ? "顯示已完成" : "隱藏已完成";
  }

  function bindEvents(){
    els.addForm.addEventListener("submit", function(e){
      e.preventDefault();
      addTask();
    });

    els.hideDoneBtn.addEventListener("click", function(){
      hideDone = !hideDone;
      saveHideDone(hideDone);
      updateHideDoneBtn();
      render();
    });

    els.taskListWrap.addEventListener("click", function(e){
      var checkbox = e.target.closest(".checkbox");
      if(checkbox){ toggleDone(checkbox.getAttribute("data-id")); return; }
      var editBtn = e.target.closest("[data-action='edit']");
      if(editBtn){ openEdit(editBtn.getAttribute("data-id")); return; }
      var delBtn = e.target.closest("[data-action='delete']");
      if(delBtn){ deleteTask(delBtn.getAttribute("data-id")); return; }
    });

    els.editCancelBtn.addEventListener("click", closeEdit);
    els.editSaveBtn.addEventListener("click", saveEdit);

    els.reminderCloseBtn.addEventListener("click", function(){ els.reminderModal.hidden = true; });
  }

  function addTask(){
    var text = els.taskText.value.trim();
    if(!text) return;
    var task = {
      id: uid(),
      date: els.taskDate.value || todayStr(),
      text: text,
      done: false,
      colorIndex: tasks.length % PALETTE.length,
      createdAt: Date.now()
    };
    tasks.push(task);
    saveTasks(tasks);
    els.taskText.value = "";
    els.taskText.focus();
    render();
  }

  function toggleDone(id){
    var task = tasks.find(function(t){ return t.id === id; });
    if(!task) return;
    task.done = !task.done;
    saveTasks(tasks);
    render();
  }

  function deleteTask(id){
    var idx = tasks.findIndex(function(t){ return t.id === id; });
    if(idx === -1) return;
    var removed = tasks.splice(idx, 1)[0];
    saveTasks(tasks);
    render();

    if(pendingDelete){ clearTimeout(pendingDelete.timeoutId); }
    var timeoutId = setTimeout(function(){
      pendingDelete = null;
      els.toast.hidden = true;
    }, 5000);
    pendingDelete = { task: removed, idx: idx, timeoutId: timeoutId };
    showToast("已刪除事項", function(){
      tasks.splice(Math.min(pendingDelete.idx, tasks.length), 0, pendingDelete.task);
      saveTasks(tasks);
      clearTimeout(pendingDelete.timeoutId);
      pendingDelete = null;
      els.toast.hidden = true;
      render();
    });
  }

  function openEdit(id){
    var task = tasks.find(function(t){ return t.id === id; });
    if(!task) return;
    editingId = id;
    els.editDate.value = task.date;
    els.editText.value = task.text;
    els.editModal.hidden = false;
  }
  function closeEdit(){ els.editModal.hidden = true; editingId = null; }
  function saveEdit(){
    var task = tasks.find(function(t){ return t.id === editingId; });
    if(!task) return;
    var text = els.editText.value.trim();
    if(!text){ return; }
    task.date = els.editDate.value || task.date;
    task.text = text;
    saveTasks(tasks);
    closeEdit();
    render();
  }

  function showToast(message, onUndo){
    els.toast.innerHTML = "";
    var span = document.createElement("span");
    span.textContent = message;
    els.toast.appendChild(span);
    if(onUndo){
      var btn = document.createElement("button");
      btn.textContent = "復原";
      btn.addEventListener("click", onUndo);
      els.toast.appendChild(btn);
    }
    els.toast.hidden = false;
    if(!onUndo){
      setTimeout(function(){ els.toast.hidden = true; }, 1800);
    }
  }

  function formatDateChip(dateStr, done){
    var today = todayStr();
    var tomorrow = addDays(today, 1);
    var d = parseDateStr(dateStr);
    var md = (d.getMonth()+1)+"/"+d.getDate();
    if(dateStr === today) return "今天 "+md;
    if(dateStr === tomorrow) return "明天 "+md;
    if(!done && dateStr < today) return "⚠️ 已過期 "+md;
    return md+" "+WEEKDAYS[d.getDay()];
  }

  function render(){
    var visible = hideDone ? tasks.filter(function(t){ return !t.done; }) : tasks.slice();
    visible.sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? -1 : 1;
      return a.createdAt - b.createdAt;
    });

    els.taskListWrap.innerHTML = "";
    if(visible.length === 0){
      els.emptyState.hidden = false;
      els.emptyText.textContent = (hideDone && tasks.length > 0)
        ? "已完成的事項都藏起來了，按上面按鈕可以再顯示"
        : "還沒有任何事項，新增一個開始吧！";
    } else {
      els.emptyState.hidden = true;
      visible.forEach(function(t){ els.taskListWrap.appendChild(renderTaskItem(t)); });
    }
  }

  function renderTaskItem(t){
    var color = PALETTE[t.colorIndex % PALETTE.length];
    var overdue = !t.done && t.date < todayStr();

    var item = document.createElement("div");
    item.className = "task-row" + (t.done ? " done" : "") + (overdue ? " overdue" : "");
    item.style.background = color.bg;

    var checkbox = document.createElement("div");
    checkbox.className = "checkbox" + (t.done ? " checked" : "");
    checkbox.setAttribute("data-id", t.id);
    checkbox.style.borderColor = color.accent;
    if(t.done){ checkbox.style.background = color.accent; }
    checkbox.textContent = t.done ? "✔" : "";
    item.appendChild(checkbox);

    var content = document.createElement("div");
    content.className = "row-content";
    var dateChip = document.createElement("span");
    dateChip.className = "row-date" + (overdue ? " overdue" : "");
    if(!overdue){ dateChip.style.color = color.accent; }
    dateChip.textContent = formatDateChip(t.date, t.done);
    content.appendChild(dateChip);
    var textEl = document.createElement("span");
    textEl.className = "row-text";
    textEl.textContent = t.text;
    content.appendChild(textEl);
    item.appendChild(content);

    var actions = document.createElement("div");
    actions.className = "row-actions";
    var editBtn = document.createElement("button");
    editBtn.className = "icon-btn";
    editBtn.setAttribute("data-action", "edit");
    editBtn.setAttribute("data-id", t.id);
    editBtn.innerHTML = ICON_EDIT;
    var delBtn = document.createElement("button");
    delBtn.className = "icon-btn";
    delBtn.setAttribute("data-action", "delete");
    delBtn.setAttribute("data-id", t.id);
    delBtn.innerHTML = ICON_DELETE;
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    item.appendChild(actions);

    return item;
  }

  init();
})();
</script>
</body>
</html>
