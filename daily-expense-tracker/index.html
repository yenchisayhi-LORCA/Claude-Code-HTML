<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>日常記帳</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FBE3E0">

<!-- iOS「加入主畫面」設定：用主畫面圖示開啟、不顯示網址列 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日常記帳">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png?v=2">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#6C93D6;
    --primary-dark:#C1546B;
    --primary-tint:#E8F0FC;
    --warn:#F0B23C;
    --warn-dark:#C98A24;
    --warn-tint:#FDEFCB;
    --danger:#E2636F;
    --danger-dark:#B23F4C;
    --danger-tint:#FBE5E7;
    --ink:#3A3050;
    --cake-purple:#6E74C7;
    --cream:#FFFBF2;
    --page-bg:#FBE3E0;
    --card:#FFFFFF;
    --line:#F3D9D8;
    --text:#2B3159;
    --text-soft:#A68990;
    --radius:16px;
    --radius-lg:26px;
    --font-display:'Baloo 2','Noto Sans TC',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--page-bg);
    font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",sans-serif;
    font-size:16px;
    color:var(--text);
    overflow-x:hidden;
    padding-bottom:100px;
  }
  h1,h2,h3,.brand-font,button,select,input{font-family:inherit;}
  button{-webkit-appearance:none;appearance:none;}

  /* ---------------------------------------------------------------- 背景裝飾色塊：粉嫩派對色（粉紅／粉藍／鵝黃） */
  .bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .bg-decor span{position:absolute;border-radius:50%;}
  .bg-decor .b1{width:480px;height:260px;background:#D7E4F7;top:-70px;left:-60px;opacity:.8;}
  .bg-decor .b2{width:420px;height:420px;background:#FBE9BE;bottom:-190px;right:-140px;opacity:.75;}
  .bg-decor .b3{width:380px;height:380px;background:#F6D3D2;bottom:-160px;left:-140px;opacity:.7;}
  .deco{position:absolute;}
  .deco svg{display:block;width:100%;height:100%;}
  .deco-dot{border-radius:50%;}

  .app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:18px 14px 0;}

  /* header */
  .header-card{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card);border-radius:var(--radius-lg);
    box-shadow:0 8px 24px rgba(30,58,138,.16);
    padding:14px 14px;margin-bottom:14px;
  }
  .header-left,.header-right{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .header-title{
    flex:1;text-align:center;font-size:22px;font-weight:800;color:var(--cake-purple);
    display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;
  }
  .header-title img{width:46px;height:46px;border-radius:13px;flex:0 0 auto;}
  .header-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .icon-round-btn{
    width:38px;height:38px;border-radius:12px;border:none;background:var(--primary-tint);
    color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-round-btn.active{background:var(--primary);color:#fff;}
  .icon-round-btn svg{width:20px;height:20px;}
  .icon-round-btn.plus{background:var(--warn);color:#fff;}

  /* category list */
  .cat-list{display:flex;flex-direction:column;gap:10px;}
  .cat-row{
    display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);
    padding:12px 14px;box-shadow:0 4px 12px rgba(30,58,138,.08);cursor:pointer;
    border:2px solid transparent;
  }
  .cat-icon{
    width:54px;height:54px;border-radius:16px;flex:0 0 auto;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .cat-icon svg{width:30px;height:30px;}
  .cat-name{flex:1;min-width:0;font-weight:700;font-size:25px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-total{font-family:var(--font-display);font-weight:800;font-size:27px;color:var(--warn-dark);flex:0 0 auto;}
  .cat-chevron{flex:0 0 auto;color:var(--text-soft);width:18px;height:18px;}
  .cat-del-btn{
    flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:none;background:var(--danger);
    color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }

  .empty-state{text-align:center;padding:60px 16px;color:var(--text-soft);}
  .empty-state .emoji{font-size:54px;display:block;margin-bottom:10px;}
  .empty-state .btn-primary{
    margin-top:14px;font-family:var(--font-display);font-weight:700;font-size:17px;color:#fff;
    background:var(--warn);border:none;border-radius:14px;padding:12px 22px;cursor:pointer;
    box-shadow:0 4px 0 var(--warn-dark);
  }

  /* bottom bar */
  .bottom-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:5;
    background:var(--card);box-shadow:0 -6px 18px rgba(30,58,138,.14);
    padding:10px 26px calc(10px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-between;
  }
  .bottom-bar-inner{max-width:480px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;}
  .bar-btn{
    background:none;border:none;color:var(--primary);cursor:pointer;
    display:flex;align-items:center;justify-content:center;width:44px;height:44px;
  }
  .bar-btn svg{width:24px;height:24px;}
  .bar-btn.danger{color:var(--danger);}
  .bar-btn.plus-big{
    width:54px;height:54px;border-radius:50%;background:var(--warn);color:#fff;
    box-shadow:0 5px 0 var(--warn-dark);
  }
  .bar-btn.plus-big svg{width:26px;height:26px;}

  /* detail view */
  #view-detail{display:none;}
  #view-detail.active{display:block;}
  #view-home.hidden{display:none;}

  .detail-header{
    display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--radius-lg);
    box-shadow:0 8px 24px rgba(30,58,138,.16);padding:14px 10px;margin-bottom:14px;
  }
  .detail-back{
    flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:none;background:none;
    color:var(--warn-dark);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .detail-back svg{width:24px;height:24px;}
  .detail-title{
    flex:1;text-align:center;font-size:28px;font-weight:800;color:var(--primary-dark);
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .detail-edit{
    flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:none;background:none;
    color:var(--text-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .detail-edit svg{width:19px;height:19px;}

  .sum-row{
    display:flex;align-items:center;justify-content:space-between;background:var(--warn-tint);
    border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;cursor:pointer;
    border:2px solid transparent;
  }
  .sum-row .sum-label{font-family:var(--font-display);font-weight:800;font-size:34px;color:var(--warn-dark);}
  .sum-row .sum-chevron{color:var(--warn-dark);width:18px;height:18px;opacity:.7;}

  .quick-add-row{margin-bottom:14px;}
  .quick-add-row input{
    width:100%;font-size:17px;color:var(--text);background:var(--card);
    border:2.5px solid var(--line);border-radius:14px;padding:13px 16px;outline:none;
  }
  .quick-add-row input:focus{border-color:var(--warn);}
  .quick-add-hint{font-size:12.5px;color:var(--text-soft);margin:6px 10px 0;}

  .entry-list{display:flex;flex-direction:column;gap:2px;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 12px rgba(30,58,138,.08);}
  .entry-row-wrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line);}
  .entry-row-wrap:last-child{border-bottom:none;}
  .entry-row-delete-bg{
    position:absolute;inset:0;background:var(--danger);color:#fff;
    display:flex;align-items:center;justify-content:flex-end;padding-right:22px;
  }
  .entry-row-delete-bg svg{width:22px;height:22px;}
  .entry-row{
    position:relative;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;
    background:var(--card);touch-action:pan-y;
  }
  .entry-row:active{background:var(--primary-tint);}
  .entry-amount{font-family:var(--font-display);font-weight:800;font-size:25px;color:var(--primary-dark);flex:0 0 auto;min-width:80px;}
  .entry-note{flex:1;min-width:0;color:var(--text-soft);font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry-date{flex:0 0 auto;font-size:18px;color:var(--text-soft);}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(30,58,138,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;}
  .modal-backdrop[hidden]{display:none;}
  .modal-sheet{background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:480px;box-shadow:0 -6px 20px rgba(0,0,0,.15);max-height:88vh;overflow-y:auto;}
  .modal-sheet h2{margin:0 0 14px;font-size:29px;color:var(--primary-dark);font-family:var(--font-display);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13.5px;font-weight:700;color:var(--text-soft);margin-bottom:5px;}
  .field input{
    width:100%;font-size:18px;color:var(--text);background:var(--cream);
    border:2.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;
  }
  .field input:focus{border-color:var(--warn);}
  .field-static{
    font-size:14px;color:var(--text-soft);background:var(--cream);border-radius:12px;
    padding:10px 12px;
  }
  .field-time label{font-size:17.5px;}
  .field-time .field-static{font-size:18px;}
  .icon-grid{display:flex;flex-wrap:wrap;gap:9px;}
  .icon-opt{
    width:48px;height:48px;border-radius:14px;border:none;background:var(--cream);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-opt svg{width:26px;height:26px;}
  .icon-opt.selected{background:var(--warn);box-shadow:0 2px 0 rgba(0,0,0,.08);}
  .modal-btns{display:flex;gap:8px;margin-top:16px;}
  .modal-btns button{flex:1;font-family:var(--font-display);font-weight:700;font-size:17px;border:none;border-radius:12px;padding:12px;cursor:pointer;}
  .btn-save{background:var(--warn);color:#fff;box-shadow:0 4px 0 var(--warn-dark);}
  .btn-cancel{background:var(--cream);color:var(--text-soft);}
  .btn-delete-row{
    width:100%;margin-top:10px;background:var(--danger-tint);color:var(--danger-dark);
    font-family:var(--font-display);font-weight:700;font-size:15px;border:none;border-radius:12px;
    padding:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .btn-delete-row svg{width:18px;height:18px;flex:0 0 auto;}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
    background:var(--primary-dark);color:#fff;padding:10px 18px;border-radius:16px;
    font-size:15px;z-index:40;box-shadow:0 6px 16px rgba(0,0,0,.2);
    display:flex;align-items:center;gap:10px;max-width:90vw;
  }
  .toast button{background:none;border:none;color:var(--warn);font-weight:800;cursor:pointer;font-size:15px;flex:0 0 auto;}
  .toast[hidden]{display:none;}
</style>
</head>
<body>
  <div class="bg-decor"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>

  <div class="app">

    <!-- ============ 首頁：帳本清單 ============ -->
    <section id="view-home">
      <header class="header-card">
        <div class="header-left">
          <button id="btnManage" class="icon-round-btn" title="管理帳本" aria-label="管理帳本">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="11" cy="17" r="2" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
        <div class="header-title"><img src="icons/icon-192.png?v=2" alt=""><span>日常記帳</span></div>
        <div class="header-right">
          <button id="btnAddCategory" class="icon-round-btn plus" title="新增帳本" aria-label="新增帳本">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </header>

      <div id="catListWrap" class="cat-list"></div>

      <div id="homeEmptyState" class="empty-state" hidden>
        <span class="emoji">🧾</span>
        <div>還沒有任何帳本，新增一個開始記帳吧！</div>
        <button id="btnEmptyAddCategory" class="btn-primary">＋ 新增帳本</button>
      </div>
    </section>

    <!-- ============ 明細頁：單一帳本的紀錄 ============ -->
    <section id="view-detail">
      <header class="detail-header">
        <button id="btnBack" class="detail-back" title="返回" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div id="detailTitle" class="detail-title"></div>
        <button id="btnEditCategory" class="detail-edit" title="編輯帳本" aria-label="編輯帳本">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        </button>
      </header>

      <div id="sumRow" class="sum-row">
        <div class="sum-label">Σ <span id="sumAmount">0.00</span></div>
        <svg class="sum-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>

      <div class="quick-add-row">
        <input type="text" id="quickAddInput" placeholder="輸入金額，例如：250 午餐" autocomplete="off" autocorrect="off" autocapitalize="off" />
      </div>
      <div class="quick-add-hint">直接輸入數字送出即可快速新增，數字後面加空白再打字可以順便寫備註</div>

      <div id="entryListWrap" class="entry-list" style="margin-top:14px;"></div>

      <div id="detailEmptyState" class="empty-state" hidden>
        <span class="emoji">✏️</span>
        <div>這本帳還沒有任何紀錄，上面輸入金額就能新增！</div>
      </div>
    </section>

  </div>

  <!-- 首頁底部工具列 -->
  <div id="bottomBarHome" class="bottom-bar">
    <div class="bottom-bar-inner">
      <button id="btnMenu" class="bar-btn" title="選單" aria-label="選單">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <button id="btnExportAll" class="bar-btn" title="匯出全部" aria-label="匯出全部">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><polyline points="7 9 12 4 17 9"/><line x1="12" y1="4" x2="12" y2="15"/></svg>
      </button>
    </div>
  </div>

  <!-- 明細頁底部工具列 -->
  <div id="bottomBarDetail" class="bottom-bar" hidden>
    <div class="bottom-bar-inner">
      <button id="btnClearEntries" class="bar-btn danger" title="清空這本帳的紀錄" aria-label="清空這本帳的紀錄">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      </button>
      <button id="btnShareCategory" class="bar-btn" title="分享 / 匯出" aria-label="分享 / 匯出">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>
      </button>
      <button id="btnAddEntry" class="bar-btn plus-big" title="新增紀錄" aria-label="新增紀錄">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- 新增／編輯帳本 -->
  <div class="modal-backdrop" id="categoryModal" hidden>
    <div class="modal-sheet">
      <h2 id="categoryModalTitle">新增帳本</h2>
      <div class="field">
        <label>帳本名稱</label>
        <input type="text" id="categoryNameInput" maxlength="20" placeholder="例如：日常、旅遊、餐飲" />
      </div>
      <div class="field">
        <label>選個圖示</label>
        <div class="icon-grid" id="categoryIconGrid"></div>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" id="categoryCancelBtn" type="button">取消</button>
        <button class="btn-save" id="categorySaveBtn" type="button">儲存</button>
      </div>
    </div>
  </div>

  <!-- 新增／編輯紀錄 -->
  <div class="modal-backdrop" id="entryModal" hidden>
    <div class="modal-sheet">
      <h2 id="entryModalTitle">新增紀錄</h2>
      <div class="field">
        <label>金額</label>
        <input type="number" id="entryAmountInput" inputmode="decimal" step="0.01" placeholder="0" />
      </div>
      <div class="field">
        <label>備註（選填）</label>
        <input type="text" id="entryNoteInput" maxlength="40" placeholder="例如：午餐、計程車" />
      </div>
      <div class="field field-time">
        <label>記錄時間</label>
        <div class="field-static" id="entryTimeStatic">—</div>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" id="entryCancelBtn" type="button">取消</button>
        <button class="btn-save" id="entrySaveBtn" type="button">儲存</button>
      </div>
      <button class="btn-delete-row" id="entryDeleteBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        刪除這筆紀錄
      </button>
    </div>
  </div>

  <!-- 選單／關於 -->
  <div class="modal-backdrop" id="menuModal" hidden>
    <div class="modal-sheet">
      <h2>📒 日常記帳</h2>
      <p class="field-static" style="margin-bottom:12px;line-height:1.6;">
        資料只存在這個瀏覽器的 localStorage，換瀏覽器、換裝置或清除瀏覽器資料都會遺失紀錄，請記得用「匯出全部」定期備份。
      </p>

  // 動物頭像圖示改用實際插畫照片（裁自氣球動物園素材），不是線條 SVG

  function iconSvgMarkup(key){
    if(ICON_IMAGES[key]){
      return '<img src="' + ICON_IMAGES[key] + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
    }
    var inner = ICON_SVGS[key] || ICON_SVGS[ICONS[0]];
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }

  // 圖示徽章底色循環，走粉嫩派對色（粉紅／粉藍／鵝黃輪流）
  var PALETTE = [
    { bg:"#FBE1DD" },
    { bg:"#DCE8F7" },
    { bg:"#FDEFCB" }
  ];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  // 每筆紀錄金額的隨機配色（藍／紫／綠／黃／橘），依 id 固定下來，重新整理不會跳色
  var AMOUNT_COLORS = ["#4A7FC9", "#8F6BC9", "#5FAE5A", "#C99A2E", "#DB7A3A"];
  function colorForEntry(id){
    var hash = 0;
    for(var i = 0; i < id.length; i++){ hash = (hash * 31 + id.charCodeAt(i)) >>> 0; }
    return AMOUNT_COLORS[hash % AMOUNT_COLORS.length];
  }

  // ---------------------------------------------------------- 紀錄列表：左滑刪除
  var TRASH_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
  var SWIPE_DELETE_THRESHOLD = 90;

  function bindSwipeToDelete(row, onDelete){
    var startX = 0, startY = 0, dx = 0, dragging = false, decided = false, isHorizontal = false;

    function onStart(e){
      startX = e.clientX;
      startY = e.clientY;
      dx = 0;
      dragging = true;
      decided = false;
      isHorizontal = false;
      row.style.transition = "none";
      if(row.setPointerCapture){ try{ row.setPointerCapture(e.pointerId); }catch(err){} }
    }
    function onMove(e){
      if(!dragging) return;
      var deltaX = e.clientX - startX;
      var deltaY = e.clientY - startY;
      if(!decided){
        if(Math.abs(deltaX) < 6 && Math.abs(deltaY) < 6) return;
        decided = true;
        isHorizontal = Math.abs(deltaX) > Math.abs(deltaY);
      }
      if(!isHorizontal) return;
      if(e.cancelable) e.preventDefault();
      dx = Math.min(0, deltaX);
      row.style.transform = "translateX(" + dx + "px)";
      row.dataset.swiped = dx < -10 ? "1" : "0";
    }
    function onEnd(e){
      if(!dragging) return;
      dragging = false;
      if(row.releasePointerCapture && e && e.pointerId !== undefined){ try{ row.releasePointerCapture(e.pointerId); }catch(err){} }
      row.style.transition = "transform .18s ease";
      if(isHorizontal && dx < -SWIPE_DELETE_THRESHOLD){
        row.style.transform = "translateX(-100%)";
        setTimeout(onDelete, 150);
      } else {
        row.style.transform = "translateX(0)";
        setTimeout(function(){ row.dataset.swiped = "0"; }, 50);
      }
    }

    row.addEventListener("pointerdown", onStart);
    row.addEventListener("pointermove", onMove);
    row.addEventListener("pointerup", onEnd);
    row.addEventListener("pointercancel", onEnd);
  }

  function loadCats(){ try{ return JSON.parse(localStorage.getItem(CATS_KEY)) || []; }catch(e){ return []; } }
  function saveCats(v){ localStorage.setItem(CATS_KEY, JSON.stringify(v)); }
  function loadEntries(){ try{ return JSON.parse(localStorage.getItem(ENTRIES_KEY)) || []; }catch(e){ return []; } }
  function saveEntries(v){ localStorage.setItem(ENTRIES_KEY, JSON.stringify(v)); }

  var categories = loadCats();
  var entries = loadEntries();
  var currentCategoryId = null;
  var editingEntryId = null;
  var editingCategoryId = null;
  var selectedIcon = ICONS[0];
  var pendingUndo = null;

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function formatDate(ts){
    var d = new Date(ts);
    return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
  }
  function formatDateTime(ts){
    var d = new Date(ts);
    return d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function formatAmount(n){
    n = Number(n) || 0;
    return Number.isInteger(n) ? String(n) : n.toFixed(2);
  }

  function categoryTotal(catId){
    return entries.filter(function(e){ return e.categoryId === catId; })
      .reduce(function(sum, e){ return sum + (Number(e.amount) || 0); }, 0);

  // ---------------------------------------------------------- 背景繽紛裝飾（圈圈／小花／氣球／禮物）
  function decoShape(type, color){
    if(type === "dot"){
      return '<div class="deco-dot" style="width:100%;height:100%;background:' + color + '"></div>';
    }
    if(type === "star"){
      return '<svg viewBox="0 0 24 24"><path d="M12 1.5l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.1l-6.3 3.8 1.5-7.1L1.8 8.9l7.2-.8Z" fill="' + color + '"/></svg>';

    if(type === "flower"){

    if(type === "gift"){
      return '<svg viewBox="0 0 24 24">'

        + '<rect x="4" y="9" width="16" height="4" fill="' + color + '" opacity=".7"/>'
        + '<line x1="12" y1="9" x2="12" y2="21" stroke="#FFF7E6" stroke-width="2"/>'
        + '<line x1="4" y1="14" x2="20" y2="14" stroke="#FFF7E6" stroke-width="2"/>'

        + '</svg>';
    }
    return "";
  }

  var DECORATIONS = [
    // 邊緣窄縫的小圈圈，不論內容多長都不會被卡片蓋住
    { type:"dot", color:"#4FA9A0", size:8, top:30, left:4 },

  function renderDecor(){
    var wrap = document.querySelector(".bg-decor");
    if(!wrap) return;
    DECORATIONS.forEach(function(d){
      var el = document.createElement("div");
      el.className = "deco";
      el.style.width = d.size + "px";
      el.style.height = (d.sizeH || d.size) + "px";
      if(d.top !== undefined) el.style.top = d.top + "px";
      if(d.bottom !== undefined) el.style.bottom = d.bottom + "px";
      if(d.left !== undefined) el.style.left = d.left + "px";
      if(d.right !== undefined) el.style.right = d.right + "px";
      if(d.rotate) el.style.transform = "rotate(" + d.rotate + "deg)";
      el.innerHTML = decoShape(d.type, d.color);
      wrap.appendChild(el);
    });
  }

  function init(){
    renderDecor();
    renderHome();
    bindEvents();
  }

  // ---------------------------------------------------------- 畫面切換
  function showHome(){
    currentCategoryId = null;
    els.viewDetail.classList.remove("active");
    els.viewHome.classList.remove("hidden");
    els.bottomBarDetail.hidden = true;
    els.bottomBarHome.hidden = false;
    renderHome();
  }

  function showDetail(catId){
    currentCategoryId = catId;
    manageMode = false;
    updateManageBtn();
    els.viewHome.classList.add("hidden");
    els.viewDetail.classList.add("active");
    els.bottomBarHome.hidden = true;
    els.bottomBarDetail.hidden = false;
    renderDetail();
  }

  // ---------------------------------------------------------- 首頁渲染
  function updateManageBtn(){
    els.btnManage.classList.toggle("active", manageMode);
  }

  function renderHome(){
    els.catListWrap.innerHTML = "";
    if(categories.length === 0){
      els.homeEmptyState.hidden = false;
      return;
    }
    els.homeEmptyState.hidden = true;

    categories.forEach(function(cat, idx){
      var color = PALETTE[idx % PALETTE.length];
      var row = document.createElement("div");
      row.className = "cat-row";

      if(manageMode){
        var delBtn = document.createElement("button");
        delBtn.className = "cat-del-btn";
        delBtn.textContent = "×";
        delBtn.setAttribute("data-action", "delete-cat");
        delBtn.setAttribute("data-id", cat.id);
        row.appendChild(delBtn);
      }

      var iconEl = document.createElement("div");
      iconEl.className = "cat-icon";
      iconEl.style.background = color.bg;
      iconEl.innerHTML = iconSvgMarkup(cat.icon);
      row.appendChild(iconEl);

      var nameEl = document.createElement("div");
      nameEl.className = "cat-name";
      nameEl.style.color = colorForEntry(cat.id);
      nameEl.textContent = cat.name;
      row.appendChild(nameEl);

      var totalEl = document.createElement("div");
      totalEl.className = "cat-total";
      totalEl.textContent = formatAmount(categoryTotal(cat.id));
      row.appendChild(totalEl);

      var chev = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      chev.setAttribute("class", "cat-chevron");
      chev.setAttribute("viewBox", "0 0 24 24");
      chev.setAttribute("fill", "none");
      chev.setAttribute("stroke", "currentColor");
      chev.setAttribute("stroke-width", "2.5");
      chev.setAttribute("stroke-linecap", "round");
      chev.setAttribute("stroke-linejoin", "round");
      chev.innerHTML = '<polyline points="9 18 15 12 9 6"/>';
      row.appendChild(chev);

      row.addEventListener("click", function(e){
        if(e.target.closest("[data-action='delete-cat']")) return;
        showDetail(cat.id);
      });

      els.catListWrap.appendChild(row);
    });
  }

  // ---------------------------------------------------------- 明細頁渲染
  function currentCategory(){
    return categories.find(function(c){ return c.id === currentCategoryId; });
  }

  function categoryEntries(){
    return entries.filter(function(e){ return e.categoryId === currentCategoryId; })
      .sort(function(a, b){ return b.ts - a.ts; });
  }

  function renderDetail(){
    var cat = currentCategory();
    if(!cat){ showHome(); return; }

    els.detailTitle.textContent = cat.name;
    var list = categoryEntries();
    var total = list.reduce(function(s, e){ return s + (Number(e.amount) || 0); }, 0);
    els.sumAmount.textContent = total.toFixed(2);

    els.entryListWrap.innerHTML = "";
    if(list.length === 0){
      els.detailEmptyState.hidden = false;
      els.entryListWrap.style.display = "none";
    } else {
      els.detailEmptyState.hidden = true;
      els.entryListWrap.style.display = "flex";
      list.forEach(function(entry){
        var wrap = document.createElement("div");
        wrap.className = "entry-row-wrap";

        var deleteBg = document.createElement("div");
        deleteBg.className = "entry-row-delete-bg";
        deleteBg.innerHTML = TRASH_ICON_SVG;
        wrap.appendChild(deleteBg);

        var row = document.createElement("div");
        row.className = "entry-row";
        row.setAttribute("data-id", entry.id);

        var amountEl = document.createElement("div");
        amountEl.className = "entry-amount";
        amountEl.style.color = colorForEntry(entry.id);
        amountEl.textContent = formatAmount(entry.amount);
        row.appendChild(amountEl);

        var noteEl = document.createElement("div");
        noteEl.className = "entry-note";
        noteEl.textContent = entry.note || "";
        row.appendChild(noteEl);

        var dateEl = document.createElement("div");
        dateEl.className = "entry-date";
        dateEl.textContent = formatDate(entry.ts);
        row.appendChild(dateEl);

        row.addEventListener("click", function(){
          if(row.dataset.swiped === "1") return;
          openEditEntry(entry.id);
        });
        wrap.appendChild(row);
        bindSwipeToDelete(row, function(){ deleteEntry(entry.id); });
        els.entryListWrap.appendChild(wrap);
      });
    }
  }

  // ---------------------------------------------------------- 帳本 新增／編輯／刪除
  function renderIconGrid(){
    els.categoryIconGrid.innerHTML = "";
    ICONS.forEach(function(icon){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "icon-opt" + (icon === selectedIcon ? " selected" : "");
      btn.innerHTML = iconSvgMarkup(icon);
      btn.addEventListener("click", function(){
        selectedIcon = icon;
        renderIconGrid();
      });
      els.categoryIconGrid.appendChild(btn);
    });
  }

  function openAddCategory(){
    editingCategoryId = null;
    els.categoryModalTitle.textContent = "新增帳本";
    els.categoryNameInput.value = "";
    selectedIcon = ICONS[0];
    renderIconGrid();
    els.categoryModal.hidden = false;
    setTimeout(function(){ els.categoryNameInput.focus(); }, 50);
  }

  function openEditCategory(catId){
    var cat = categories.find(function(c){ return c.id === catId; });
    if(!cat) return;
    editingCategoryId = catId;
    els.categoryModalTitle.textContent = "編輯帳本";
    els.categoryNameInput.value = cat.name;
    selectedIcon = cat.icon || ICONS[0];
    renderIconGrid();
    els.categoryModal.hidden = false;
  }

  function closeCategoryModal(){ els.categoryModal.hidden = true; }

  function saveCategory(){
    var name = els.categoryNameInput.value.trim();
    if(!name){ els.categoryNameInput.focus(); return; }

    if(editingCategoryId){
      var cat = categories.find(function(c){ return c.id === editingCategoryId; });
      if(cat){ cat.name = name; cat.icon = selectedIcon; }
    } else {
      categories.push({ id: uid(), name: name, icon: selectedIcon, createdAt: Date.now() });
    }
    saveCats(categories);
    closeCategoryModal();
    if(currentCategoryId){ renderDetail(); } else { renderHome(); }
  }

  function deleteCategory(catId){
    var idx = categories.findIndex(function(c){ return c.id === catId; });
    if(idx === -1) return;
    var removedCat = categories[idx];
    var removedEntries = entries.filter(function(e){ return e.categoryId === catId; });

    categories.splice(idx, 1);
    entries = entries.filter(function(e){ return e.categoryId !== catId; });
    saveCats(categories);
    saveEntries(entries);
    renderHome();

    showUndoToast("已刪除「" + removedCat.name + "」", function(){
      categories.splice(idx, 0, removedCat);
      entries = entries.concat(removedEntries);
      saveCats(categories);
      saveEntries(entries);
      renderHome();
    });
  }

  // ---------------------------------------------------------- 紀錄 新增／編輯／刪除
  function openAddEntry(){
    if(!currentCategoryId) return;
    editingEntryId = null;
    els.entryModalTitle.textContent = "新增紀錄";
    els.entryAmountInput.value = "";
    els.entryNoteInput.value = "";
    els.entryTimeStatic.textContent = formatDateTime(Date.now());
    els.entryDeleteBtn.hidden = true;
    els.entryModal.hidden = false;
    setTimeout(function(){ els.entryAmountInput.focus(); }, 50);
  }

  function openEditEntry(entryId){
    var entry = entries.find(function(e){ return e.id === entryId; });
    if(!entry) return;
    editingEntryId = entryId;
    els.entryModalTitle.textContent = "編輯紀錄";
    els.entryAmountInput.value = entry.amount;
    els.entryNoteInput.value = entry.note || "";
    els.entryTimeStatic.textContent = formatDateTime(entry.ts);
    els.entryDeleteBtn.hidden = false;
    els.entryModal.hidden = false;
  }

  function closeEntryModal(){ els.entryModal.hidden = true; }

  function saveEntry(){
    var amount = parseFloat(els.entryAmountInput.value);
    if(isNaN(amount)){ els.entryAmountInput.focus(); return; }
    var note = els.entryNoteInput.value.trim();

    if(editingEntryId){
      var entry = entries.find(function(e){ return e.id === editingEntryId; });
      if(entry){ entry.amount = amount; entry.note = note; entry.ts = Date.now(); }
    } else {
      entries.push({ id: uid(), categoryId: currentCategoryId, amount: amount, note: note, ts: Date.now() });
    }
    saveEntries(entries);
    closeEntryModal();
    renderDetail();
  }

  function deleteEntry(entryId){
    var idx = entries.findIndex(function(e){ return e.id === entryId; });
    if(idx === -1) return;
    var removed = entries.splice(idx, 1)[0];
    saveEntries(entries);
    closeEntryModal();
    renderDetail();

    showUndoToast("已刪除這筆紀錄", function(){
      entries.splice(Math.min(idx, entries.length), 0, removed);
      saveEntries(entries);
      renderDetail();
    });
  }

  function clearCategoryEntries(){
    if(!currentCategoryId) return;
    var list = categoryEntries();
    if(list.length === 0) return;
    if(!confirm("確定要清空「" + currentCategory().name + "」目前的所有紀錄嗎？")) return;

    var removedIds = list.map(function(e){ return e.id; });
    var removedEntries = entries.filter(function(e){ return removedIds.indexOf(e.id) !== -1; });
    entries = entries.filter(function(e){ return removedIds.indexOf(e.id) === -1; });
    saveEntries(entries);
    renderDetail();

    showUndoToast("已清空所有紀錄", function(){
      entries = entries.concat(removedEntries);
      saveEntries(entries);
      renderDetail();
    });
  }

  // ---------------------------------------------------------- 快速輸入（金額 + 備註）
  function handleQuickAdd(){
    var raw = els.quickAddInput.value.trim();
    if(!raw) return;
    var match = raw.match(/^(-?\d+(?:\.\d+)?)\s*(.*)$/);
    if(!match){
      els.quickAddInput.style.borderColor = "#E8574B";
      setTimeout(function(){ els.quickAddInput.style.borderColor = ""; }, 600);
      return;
    }
    var amount = parseFloat(match[1]);
    var note = match[2].trim();
    entries.push({ id: uid(), categoryId: currentCategoryId, amount: amount, note: note, ts: Date.now() });
    saveEntries(entries);
    els.quickAddInput.value = "";
    renderDetail();
  }

  // ---------------------------------------------------------- 匯出／分享
  function buildCsv(list, cats){
    var rows = [["帳本", "金額", "備註", "時間"]];
    list.forEach(function(e){
      var cat = cats.find(function(c){ return c.id === e.categoryId; });
      rows.push([cat ? cat.name : "", e.amount, e.note || "", formatDateTime(e.ts)]);
    });
    return rows.map(function(r){
      return r.map(function(v){
        var s = String(v).replace(/"/g, '""');
        return /[",\n]/.test(s) ? '"' + s + '"' : s;
      }).join(",");
    }).join("\n");
  }

  function shareOrDownload(filename, text){
    if(navigator.share){
      navigator.share({ title: filename, text: text }).catch(function(){});
      return;
    }
    var blob = new Blob([text], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function exportAll(){
    if(entries.length === 0){ showToast("目前還沒有任何紀錄"); return; }
    var csv = buildCsv(entries.slice().sort(function(a, b){ return b.ts - a.ts; }), categories);
    shareOrDownload("日常記帳.csv", csv);
  }

  function exportCurrentCategory(){
    var list = categoryEntries();
    if(list.length === 0){ showToast("這本帳還沒有任何紀錄"); return; }
    var cat = currentCategory();
    var csv = buildCsv(list, categories);
    shareOrDownload((cat ? cat.name : "帳本") + ".csv", csv);
  }

  // ---------------------------------------------------------- toast
  function showToast(message, duration){
    els.toast.innerHTML = "";
    var span = document.createElement("span");
    span.textContent = message;
    els.toast.appendChild(span);
    els.toast.hidden = false;
    setTimeout(function(){ els.toast.hidden = true; }, duration || 1800);
  }

  function showUndoToast(message, onUndo){
    if(pendingUndo){ clearTimeout(pendingUndo.timeoutId); }
    els.toast.innerHTML = "";
    var span = document.createElement("span");
    span.textContent = message;
    els.toast.appendChild(span);
    var btn = document.createElement("button");
    btn.textContent = "復原";
    btn.addEventListener("click", function(){
      clearTimeout(pendingUndo.timeoutId);
      pendingUndo = null;
      els.toast.hidden = true;
      onUndo();
    });
    els.toast.appendChild(btn);
    els.toast.hidden = false;
    var timeoutId = setTimeout(function(){
      pendingUndo = null;
      els.toast.hidden = true;
    }, 5000);
    pendingUndo = { timeoutId: timeoutId };
  }

  // ---------------------------------------------------------- 統計小彈窗（Σ 列）
  function showSumStats(){
    var list = categoryEntries();
    if(list.length === 0){ showToast("這本帳還沒有任何紀錄"); return; }
    var total = list.reduce(function(s, e){ return s + (Number(e.amount) || 0); }, 0);
    var avg = total / list.length;
    showToast("共 " + list.length + " 筆紀錄，平均每筆 " + formatAmount(avg), 2600);
  }

  // ---------------------------------------------------------- 事件綁定
  function bindEvents(){
    els.btnManage.addEventListener("click", function(){
      manageMode = !manageMode;
      updateManageBtn();
      renderHome();
    });

    els.btnAddCategory.addEventListener("click", openAddCategory);
    els.btnEmptyAddCategory.addEventListener("click", openAddCategory);

    els.catListWrap.addEventListener("click", function(e){
      var delBtn = e.target.closest("[data-action='delete-cat']");
      if(delBtn){
        e.stopPropagation();
        deleteCategory(delBtn.getAttribute("data-id"));
      }
    });

    els.btnBack.addEventListener("click", showHome);
    els.btnEditCategory.addEventListener("click", function(){
      if(currentCategoryId) openEditCategory(currentCategoryId);
    });

    els.sumRow.addEventListener("click", showSumStats);

    els.quickAddInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); handleQuickAdd(); }
    });

    els.btnAddEntry.addEventListener("click", openAddEntry);
    els.btnClearEntries.addEventListener("click", clearCategoryEntries);
    els.btnShareCategory.addEventListener("click", exportCurrentCategory);

    els.btnMenu.addEventListener("click", function(){ els.menuModal.hidden = false; });
    els.menuCloseBtn.addEventListener("click", function(){ els.menuModal.hidden = true; });
    els.btnResetAll.addEventListener("click", function(){
      if(!confirm("確定要清除所有帳本與紀錄嗎？這個動作無法復原。")) return;
      categories = [];
      entries = [];
      saveCats(categories);
      saveEntries(entries);
      els.menuModal.hidden = true;
      showHome();
    });
    els.btnExportAll.addEventListener("click", exportAll);

    // 帳本 modal
    els.categoryCancelBtn.addEventListener("click", closeCategoryModal);
    els.categorySaveBtn.addEventListener("click", saveCategory);
    els.categoryNameInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); saveCategory(); }
    });

    // 紀錄 modal
    els.entryCancelBtn.addEventListener("click", closeEntryModal);
    els.entrySaveBtn.addEventListener("click", saveEntry);
    els.entryDeleteBtn.addEventListener("click", function(){
      if(editingEntryId) deleteEntry(editingEntryId);
    });
    els.entryNoteInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); saveEntry(); }
    });

    // 點背景關閉 modal
    [els.categoryModal, els.entryModal, els.menuModal].forEach(function(modal){
      modal.addEventListener("click", function(e){
        if(e.target === modal) modal.hidden = true;
      });
    });
  }

  init();
})();
</script>
</body>
</html>
