<!-- @dsCard group="洞察" height=300 subtitle="異常觀察卡" -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-sans);color:var(--ink);}
  .a{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px 24px;display:grid;grid-template-columns:200px 1fr;gap:22px;}
  .side{border-right:1px dashed var(--line);padding-right:20px;}
  .badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);margin-bottom:12px;background:var(--neg-soft);color:var(--neg);}
  .name{font-family:var(--font-serif);font-weight:700;font-size:19px;margin:0 0 6px;}
  .metric{font-size:12.5px;color:var(--ink-soft);margin-top:10px;}
  .metric b{display:block;font-family:var(--font-serif);font-size:16px;color:var(--ink);}
  h5{margin:0 0 8px;font-size:15px;}
  p{margin:0 0 10px;font-size:13.8px;color:var(--ink-body);line-height:1.6;}
  .ev{background:var(--paper-dim);border-radius:var(--radius-sm);padding:10px 14px;font-size:12.8px;color:var(--ink-soft);border-left:3px solid var(--gold);}
  .row{display:flex;gap:8px;align-items:flex-start;} .row+.row{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .tag{flex:none;font-family:var(--font-serif);font-weight:700;font-size:12px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-xs);padding:1px 8px;}
</style>
<div class="a">
  <div class="side">
    <div class="badge">轉盈為虧</div>
    <p class="name">南崁店</p>
    <div class="metric">EBITDA變動<b>−84,000 元（N/A）</b></div>
  </div>
  <div>
    <h5>2026年5月 36,000 元 → 2026年6月 −48,000 元</h5>
    <p>系統依科目變動金額找出貢獻本期EBITDA變動最大的收入與四大可控成本科目小類，供進一步查核：</p>
    <div class="ev">
      <div class="row"><span class="tag">收入</span>銷貨收入-餐飲：520,000 → 468,000（−52,000）</div>
      <div class="row"><span class="tag">人力成本</span>薪資：210,000 → 224,000（+14,000）</div>
      <div class="row"><span class="tag">水電瓦斯</span>電費：48,000 → 61,000（+13,000）</div>
    </div>
  </div>
</div>
