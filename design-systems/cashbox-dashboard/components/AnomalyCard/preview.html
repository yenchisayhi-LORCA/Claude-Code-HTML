<!-- @dsCard group="洞察" height=270 subtitle="異常觀察卡" -->
<style>
  body{margin:0;padding:var(--space-5);background:var(--paper);font-family:var(--font-sans);color:var(--ink);}
  .a{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 18px;display:grid;grid-template-columns:200px 1fr;gap:20px;}
  .side{border-right:1px dashed var(--line);padding-right:18px;}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:var(--radius-xs);margin-bottom:10px;background:var(--neg-soft);color:var(--neg-ink);border:1px solid var(--neg);}
  .name{font-weight:700;font-size:17px;margin:0 0 6px;}
  .metric{font-size:12px;color:var(--ink-soft);margin-top:10px;}
  .metric b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;}
  h5{margin:0 0 6px;font-size:13px;font-variant-numeric:tabular-nums;}
  p{margin:0 0 10px;font-size:12.5px;color:var(--ink-body);line-height:1.6;}
  .ev{background:var(--paper-dim);border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;color:var(--ink);border-left:3px solid var(--gold);}
  .row{display:flex;gap:8px;align-items:flex-start;font-variant-numeric:tabular-nums;}
  .row+.row{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);}
  .tag{flex:none;font-weight:700;font-size:11.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-xs);padding:0 8px;}
</style>
<div class="a">
  <div class="side">
    <div class="badge">轉盈為虧</div>
    <p class="name">桃園店</p>
    <div class="metric">EBITDA 變動<b>−84,000 元（N/A）</b></div>
  </div>
  <div>
    <h5>2026年5月 36,000 元 → 2026年6月 −48,000 元</h5>
    <p>依科目變動金額找出貢獻本期 EBITDA 變動最大的收入與可控成本科目小類，供進一步查核：</p>
    <div class="ev">
      <div class="row"><span class="tag">收入</span>銷貨收入-餐飲：520,000 → 468,000（−52,000）</div>
      <div class="row"><span class="tag">人力成本</span>薪資：210,000 → 224,000（+14,000）</div>
      <div class="row"><span class="tag">水電瓦斯</span>電費：48,000 → 61,000（+13,000）</div>
    </div>
  </div>
</div>
