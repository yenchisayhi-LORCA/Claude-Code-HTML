<!-- @dsCard group="導覽與按鈕" height=260 subtitle="深色頁首" -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-sans);}
  .hero{background:radial-gradient(900px 340px at 82% -10%, rgba(44,104,167,.20), transparent 60%),radial-gradient(600px 280px at 8% -20%, rgba(227,147,52,.16), transparent 55%),var(--ink);
    color:var(--paper);padding:36px 32px 32px;position:relative;overflow:hidden;border-bottom:6px solid var(--brand);}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:6px;background:linear-gradient(90deg,var(--brand),var(--gold),var(--brand));}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.16em;font-weight:700;color:var(--gold-soft);border:1px solid rgba(243,230,200,.35);padding:5px 12px;border-radius:var(--radius-pill);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
  h1{font-family:var(--font-serif);font-size:38px;font-weight:900;margin:14px 0 6px;}
  .sub{color:var(--hero-sub);font-size:14.5px;margin:0;max-width:560px;}
  .meta{display:flex;gap:28px;margin-top:22px;}
  .m{border-left:2px solid rgba(243,230,200,.35);padding-left:14px;}
  .m .l{font-size:11.5px;color:var(--hero-muted);letter-spacing:.08em;}
  .m .v{font-family:var(--font-serif);font-size:19px;font-weight:700;}
</style>
<header class="hero">
  <span class="eyebrow"><span class="dot"></span>部門分類帳彙整分析</span>
  <h1>CB各門市損益分析儀表板</h1>
  <p class="sub">依據簡損表科目定義還原租賃權，計算各門市營業淨利與 EBITDA 並比較期間變化。</p>
  <div class="meta">
    <div class="m"><div class="l">分析期間</div><div class="v">2025年1月 – 2026年6月</div></div>
    <div class="m"><div class="l">涵蓋門市 / 單位</div><div class="v">22 個</div></div>
  </div>
</header>
