<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>吉祥物與圖示色塊</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
:root {
  --sun-yellow: #FFD426; --ink-navy: #262261; --cream-paper: #FFFCEF; --white: #FFFFFF;
  --text-body: #5A5788; --text-muted: #8B88B2; --radius-pill: 999px; --radius-card: 28px;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 40px; font-family: 'Noto Sans TC', -apple-system, 'PingFang TC', system-ui, sans-serif; background: var(--cream-paper); color: var(--ink-navy); }
h1 { font-size: 28px; font-weight: 900; margin: 0 0 6px; }
p.lede { color: var(--text-body); font-size: 15px; margin: 0 0 32px; max-width: 680px; line-height: 1.7; }
.section { margin-bottom: 34px; background: var(--white); border-radius: var(--radius-card); padding: 26px 30px; }
.label { font-family: 'Gluten', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 1px; color: var(--text-body); text-transform: uppercase; margin-bottom: 16px; }
.row { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.mascot-cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.mascot-cell .cap { font-family: 'Gluten', sans-serif; font-weight: 700; font-size: 12px; color: var(--text-muted); }

.kid-tab { display: flex; align-items: center; gap: 12px; padding: 8px 22px 8px 8px; border-radius: var(--radius-pill); border: none; background: transparent; cursor: pointer; font-family: inherit; font-weight: 900; color: var(--text-body); }
.kid-tab.active { background: var(--sun-yellow); color: var(--ink-navy); }
.kid-tab-avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; display: block; }
.kid-tab-balance { font-family: 'Gluten', sans-serif; font-weight: 800; font-size: 14px; color: var(--text-muted); }
.kid-tab.active .kid-tab-balance { color: var(--ink-navy); }

.icon-chip { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-chip svg { color: var(--ink-navy); }
</style>
</head>
<body>
  <h1>塗鴉童趣風 — 吉祥物與圖示色塊</h1>
  <p class="lede">沒有大頭貼的小孩，預設顯示一隻「色塊小怪獸」：一個圓潤色塊 blob（四色輪替）+ 兩個圓點眼睛 + 一條微笑弧線，用小孩 id 字串的 hash 決定顏色，同一個小孩永遠是同一隻怪獸。所有任務/商店/獎狀的圖示色塊也用同一套 hash 邏輯，各自算出 40–65% 區間的不規則圓角跟 ±4 度旋轉，製造「每張貼紙都手工貼得不太一樣」的效果。</p>

  <div class="section">
    <div class="label">色塊小怪獸（無照片預設頭像）</div>
    <div class="row">
      <div class="mascot-cell">
        <svg viewBox="0 0 60 60" width="64" height="64"><path d="M30 3c16 0 28 14 28 31 0 14-12 23-28 23S2 48 2 34C2 17 14 3 30 3Z" fill="#FF9EC4"/><circle cx="21" cy="30" r="3" fill="#262261"/><circle cx="39" cy="30" r="3" fill="#262261"/><path d="M22 39c4 5 13 5 17-1" fill="none" stroke="#262261" stroke-width="3" stroke-linecap="round"/></svg>
        <span class="cap">#FF9EC4</span>
      </div>
      <div class="mascot-cell">
        <svg viewBox="0 0 60 60" width="64" height="64"><path d="M30 3c16 0 28 14 28 31 0 14-12 23-28 23S2 48 2 34C2 17 14 3 30 3Z" fill="#4FD2C2"/><circle cx="21" cy="30" r="3" fill="#262261"/><circle cx="39" cy="30" r="3" fill="#262261"/><path d="M22 39c4 5 13 5 17-1" fill="none" stroke="#262261" stroke-width="3" stroke-linecap="round"/></svg>
        <span class="cap">#4FD2C2</span>
      </div>
      <div class="mascot-cell">
        <svg viewBox="0 0 60 60" width="64" height="64"><path d="M30 3c16 0 28 14 28 31 0 14-12 23-28 23S2 48 2 34C2 17 14 3 30 3Z" fill="#FFD426"/><circle cx="21" cy="30" r="3" fill="#262261"/><circle cx="39" cy="30" r="3" fill="#262261"/><path d="M22 39c4 5 13 5 17-1" fill="none" stroke="#262261" stroke-width="3" stroke-linecap="round"/></svg>
        <span class="cap">#FFD426</span>
      </div>
      <div class="mascot-cell">
        <svg viewBox="0 0 60 60" width="64" height="64"><path d="M30 3c16 0 28 14 28 31 0 14-12 23-28 23S2 48 2 34C2 17 14 3 30 3Z" fill="#3F6FD1"/><circle cx="21" cy="30" r="3" fill="#fff"/><circle cx="39" cy="30" r="3" fill="#fff"/><path d="M22 39c4 5 13 5 17-1" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
        <span class="cap">#3F6FD1</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="label">小孩切換器 kid-tab</div>
    <div class="row">
      <button class="kid-tab active"><svg class="kid-tab-avatar" viewBox="0 0 60 60"><path d="M30 3c16 0 28 14 28 31 0 14-12 23-28 23S2 48 2 34C2 17 14 3 30 3Z" fill="#FFD426"/><circle cx="21" cy="30" r="3" fill="#262261"/><circle cx="39" cy="30" r="3" fill="#262261"/><path d="M22 39c4 5 13 5 17-1" fill="none" stroke="#262261" stroke-width="3" stroke-linecap="round"/></svg><span><div>樂樂</div><div class="kid-tab-balance">12</div></span></button>
      <button class="kid-tab"><svg class="kid-tab-avatar" viewBox="0 0 60 60"><path d="M30 3c16 0 28 14 28 31 0 14-12 23-28 23S2 48 2 34C2 17 14 3 30 3Z" fill="#FF9EC4"/><circle cx="21" cy="30" r="3" fill="#262261"/><circle cx="39" cy="30" r="3" fill="#262261"/><path d="M22 39c4 5 13 5 17-1" fill="none" stroke="#262261" stroke-width="3" stroke-linecap="round"/></svg><span><div>熙熙</div><div class="kid-tab-balance">8</div></span></button>
    </div>
  </div>

  <div class="section">
    <div class="label">圖示色塊 icon-chip（不規則圓角 + 旋轉，四色輪替）</div>
    <div class="row">
      <div class="icon-chip" style="width:64px;height:64px;background:#FFF0AF;border-radius:52% 48% 61% 39% / 58% 43% 57% 42%;transform:rotate(-3deg);"><svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 24.5c5.5 0 9.5 3.5 9.5 8s-4 6-9.5 6-9.5-1.5-9.5-6 4-8 9.5-8Z"/><path d="M14 13c2.2 0 3.8 2.2 3.8 5s-1.6 4.6-3.8 4.6S10.2 20.8 10.2 18 11.8 13 14 13ZM34 13c2.2 0 3.8 2.2 3.8 5s-1.6 4.6-3.8 4.6S30.2 20.8 30.2 18 31.8 13 34 13Z"/><path d="M22 8.5c1.8 0 3.2 2 3.2 4.6s-1.4 4.4-3.2 4.4-3.2-1.8-3.2-4.4S20.2 8.5 22 8.5Z"/></svg></div>
      <div class="icon-chip" style="width:64px;height:64px;background:#CFDDF8;border-radius:60% 40% 44% 56% / 46% 55% 45% 54%;transform:rotate(2deg);"><svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 29.5h17l-2.5 11.5c-4 .8-8 .8-12 0Z"/><path d="M24 29.5V17"/><path d="M24 21c-4.5.5-7.5-1.5-8-6 4.5-.5 7.5 1.5 8 6Z"/><path d="M24 24c4.5.5 8-2 8.5-7.5-5 0-8.5 2.5-8.5 7.5Z"/></svg></div>
      <div class="icon-chip" style="width:64px;height:64px;background:#FBD3D0;border-radius:45% 55% 52% 48% / 62% 40% 60% 38%;transform:rotate(-4deg);"><svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5c5.5-2 11-2 16 1.5 5-3.5 10.5-3.5 16-1.5V35c-5.5-2-11-2-16 1.5-5-3.5-10.5-3.5-16-1.5Z"/><path d="M24 14v22.5"/></svg></div>
      <div class="icon-chip" style="width:64px;height:64px;background:#C9F0E9;border-radius:55% 45% 48% 52% / 44% 58% 42% 56%;transform:rotate(4deg);"><svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 10.5c1.5 3 3.5 4.5 5.5 4.5s4-1.5 5.5-4.5c4 1 7.5 2.5 10.5 4.5l-4 8-3-1.5v17c-6 1-12 1-18 0v-17L12 23l-4-8c3-2 6.5-3.5 10.5-4.5Z"/></svg></div>
    </div>
  </div>
</body>
</html>
