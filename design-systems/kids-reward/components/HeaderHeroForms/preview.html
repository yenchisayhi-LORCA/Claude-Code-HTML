<!-- @dsCard group="Components" page height=1180 subtitle="頁首、餘額卡、分頁與表單" -->
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>頁首、餘額卡與表單</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
:root {
  --sun-yellow: #FFD426; --tomato-red: #EE3E33; --ink-navy: #262261; --cream-paper: #FFFCEF;
  --white: #FFFFFF; --text-body: #5A5788; --text-muted: #8B88B2; --radius-pill: 999px;
  --radius-panel: 40px; --radius-card: 28px; --radius-input: 18px;
  --shadow-frame: 0 18px 40px rgba(38, 34, 97, .12);
  --tomato-deep: #D93A2F;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 0 0 50px; font-family: 'Noto Sans TC', -apple-system, 'PingFang TC', system-ui, sans-serif; background: var(--cream-paper); color: var(--ink-navy); }
h1 { font-size: 24px; font-weight: 900; margin: 0 0 6px; padding: 40px 40px 0; }
p.lede { color: var(--text-body); font-size: 15px; margin: 0 0 28px; max-width: 640px; line-height: 1.7; padding: 0 40px; }
.label { font-family: 'Gluten', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 1px; color: var(--text-body); text-transform: uppercase; margin: 0 40px 14px; }
.wrap { padding: 0 40px; margin-bottom: 36px; }

/* 頁首 */
.app-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: var(--white); flex-wrap: wrap; gap: 12px; }
.app-title { font-size: 26px; font-weight: 900; display: flex; align-items: center; gap: 8px; letter-spacing: .5px; }
.app-logo { width: 40px; height: 40px; border-radius: 55% 45% 60% 40% / 45% 55% 45% 55%; display: flex; align-items: center; justify-content: center; background: var(--sun-yellow); transform: rotate(-4deg); color: var(--ink-navy); }
.app-logo svg { width: 24px; height: 24px; }
.kid-switcher { display: flex; gap: 10px; align-items: center; }
.kid-tab { display: flex; align-items: center; gap: 12px; padding: 8px 22px 8px 8px; border-radius: var(--radius-pill); border: none; background: transparent; font-weight: 900; color: var(--text-body); }
.kid-tab.active { background: var(--sun-yellow); color: var(--ink-navy); }
.kid-tab-avatar { width: 44px; height: 44px; border-radius: 50%; }
.kid-tab-balance { font-family: 'Gluten', sans-serif; font-weight: 800; font-size: 14px; }
.kid-tab.active .kid-tab-balance { color: var(--ink-navy); }

/* 餘額卡 */
.balance-hero { display: flex; align-items: center; gap: 20px; background: var(--sun-yellow); border-radius: 34px; padding: 24px 28px; }
.balance-hero-avatar { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--white); }
.balance-hero-name { font-size: 24px; font-weight: 900; margin: 0 0 4px; }
.balance-hero-amount { font-family: 'Gluten', sans-serif; font-size: 30px; font-weight: 800; color: var(--ink-navy); display: flex; align-items: center; gap: 8px; }
.balance-hero-amount svg { width: 30px; height: 30px; color: var(--ink-navy); }
.balance-hero-amount .unit { font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-navy); margin-left: 2px; }

/* tabs */
.tabs { display: flex; gap: 12px; padding: 10px 12px; background: var(--cream-paper); border-radius: var(--radius-pill); width: fit-content; }
.tab-btn { display: flex; align-items: center; padding: 12px 22px; border-radius: var(--radius-pill); border: none; background: transparent; font-weight: 900; color: var(--ink-navy); font-size: 16px; }
.tab-btn.active { background: var(--ink-navy); color: var(--white); }
.tab-btn svg { width: 20px; height: 20px; margin-right: 8px; }
.tab-btn.active svg { color: var(--sun-yellow); }

/* 表單 */
.dialog-form { padding: 28px 26px; display: flex; flex-direction: column; gap: 16px; background: var(--cream-paper); border-radius: var(--radius-panel); box-shadow: var(--shadow-frame); max-width: 380px; }
.dialog-form h2 { font-size: 24px; margin: 0; display: flex; align-items: center; }
.dialog-form label { display: flex; flex-direction: column; gap: 8px; font-weight: 900; font-size: 14px; color: var(--text-body); }
.dialog-form input[type="text"], .dialog-form input[type="number"] { font: inherit; font-size: 18px; font-weight: 700; color: var(--ink-navy); padding: 14px 16px; border-radius: var(--radius-input); border: none; background: var(--white); }
.dialog-form input:focus { outline: 3px solid var(--sun-yellow); outline-offset: 1px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 12px; }
.btn { border: none; border-radius: var(--radius-pill); padding: 14px 26px; font-weight: 900; cursor: pointer; font-family: inherit; font-size: 15px; }
.btn-primary { background: var(--tomato-deep); color: var(--white); }
.btn-ghost { background: transparent; color: var(--ink-navy); border: 3px solid var(--ink-navy); padding: 11px 23px; }
.icon-picker { display: flex; flex-wrap: wrap; gap: 10px; }
.icon-option { width: 46px; height: 46px; padding: 0; border-radius: var(--radius-input); border: none; background: var(--white); color: var(--ink-navy); display: flex; align-items: center; justify-content: center; }
.icon-option svg { width: 26px; height: 26px; }
.icon-option.selected { background: var(--sun-yellow); transform: rotate(-5deg); }
</style>
</head>
<body>
  <h1>塗鴉童趣風 — 頁首／餘額卡／分頁／表單</h1>
  <p class="lede">頁首白底置頂；餘額卡用高飽和黃色塊整塊鋪底，數字用 Gluten 墨藍大字；分頁列是米白底膠囊，選中項目直接變墨藍實心塊；對話框統一大圓角（40px）+ 米白底 + 柔和陰影，表單欄位一律白底、無邊框、focus 時outline 黃。</p>

  <div class="wrap" style="padding:0;">
    <header class="app-header">
      <div class="app-title"><span class="app-logo"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6c1.6 1 3.4 6.6 5.2 11.6 5.4.4 11 .8 12 1.6.9.9-3.6 4.6-7.6 8.4 1.2 5.2 2.7 10.8 2.1 11.6-.7.8-5.8-2.1-11.7-5.3-5.6 3-10.8 6.1-11.6 5.3-.8-.8.7-6.3 2-11.6-4-3.8-8.5-7.5-7.6-8.4.9-.8 6.5-1.2 12-1.6C20.5 12.6 22.4 7 24 6Z"/></svg></span> 小孩獎勵紀錄本</div>
      <div class="kid-switcher">
        <button class="kid-tab active"><img class="kid-tab-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Cpath d='M30 3c16 0 28 14 28 31 0 14-12 23-28 23S2 48 2 34C2 17 14 3 30 3Z' fill='%23FFD426'/%3E%3Ccircle cx='21' cy='30' r='3' fill='%23262261'/%3E%3Ccircle cx='39' cy='30' r='3' fill='%23262261'/%3E%3Cpath d='M22 39c4 5 13 5 17-1' fill='none' stroke='%23262261' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" /><span><div>樂樂</div><div class="kid-tab-balance">12</div></span></button>
      </div>
    </header>
  </div>

  <div class="label">餘額卡 balance-hero</div>
  <div class="wrap">
    <div class="balance-hero">
      <img class="balance-hero-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Cpath d='M30 3c16 0 28 14 28 31 0 14-12 23-28 23S2 48 2 34C2 17 14 3 30 3Z' fill='%23FF9EC4'/%3E%3Ccircle cx='21' cy='30' r='3' fill='%23262261'/%3E%3Ccircle cx='39' cy='30' r='3' fill='%23262261'/%3E%3Cpath d='M22 39c4 5 13 5 17-1' fill='none' stroke='%23262261' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
      <div>
        <div class="balance-hero-name">樂樂</div>
        <div class="balance-hero-amount"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6c1.6 1 3.4 6.6 5.2 11.6 5.4.4 11 .8 12 1.6.9.9-3.6 4.6-7.6 8.4 1.2 5.2 2.7 10.8 2.1 11.6-.7.8-5.8-2.1-11.7-5.3-5.6 3-10.8 6.1-11.6 5.3-.8-.8.7-6.3 2-11.6-4-3.8-8.5-7.5-7.6-8.4.9-.8 6.5-1.2 12-1.6C20.5 12.6 22.4 7 24 6Z"/></svg>12<span class="unit">顆星星</span></div>
      </div>
    </div>
  </div>

  <div class="label">分頁 tabs</div>
  <div class="wrap">
    <nav class="tabs">
      <button class="tab-btn active"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 25.5c3 2 6 4.5 8.5 7.5C26 26 31 19.5 37 14"/></svg>今日任務</button>
      <button class="tab-btn"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="29" cy="11.5" r="4.5"/><path d="M27 19c-4 1.5-7 4.5-8.5 8.5"/><path d="M27 19c3.5.5 5.5 3 6 6.5.4 3-.5 5.5-2 7.5"/><path d="M25 33l-3.5 7M31 33l4 6.5"/><path d="M20 24l-8 1.5"/></svg>運動回報</button>
      <button class="tab-btn"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19.5c1-3.5 2.5-7 4-9.5 7.5-1 14.5-1 22 0 1.5 2.5 3 6 4 9.5-10 1-20 1-30 0Z"/><path d="M11.5 20v19c8.5 1 16.5 1 25 0V20"/><path d="M19 39V28.5c3.5-.5 7-.5 10.5 0V39"/></svg>星星商店</button>
    </nav>
  </div>

  <div class="label">表單 dialog-form</div>
  <div class="wrap">
    <div class="dialog-form">
      <h2>新增作業</h2>
      <label>名稱 <input type="text" value="練習鋼琴" /></label>
      <label>圖示</label>
      <div class="icon-picker">
        <button class="icon-option selected"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 33.5V13c4.5-1.2 9-2.4 13.5-3.4v6C28 16.6 23.5 17.6 19 18.6"/><path d="M19 33.5c0 2.5-2 4.5-4.5 4.5S10 36 10 33.5s2-4.5 4.5-4.5 4.5 2 4.5 4.5Z"/></svg></button>
        <button class="icon-option"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5c5.5-2 11-2 16 1.5 5-3.5 10.5-3.5 16-1.5V35c-5.5-2-11-2-16 1.5-5-3.5-10.5-3.5-16-1.5Z"/><path d="M24 14v22.5"/></svg></button>
        <button class="icon-option"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 8c1 6 3.5 12 8 16-4.5 4-7 10-8 16-1-6-3.5-12-8-16 4.5-4 7-10 8-16Z"/></svg></button>
      </div>
      <label>星星數 <input type="number" value="3" /></label>
      <div class="dialog-actions">
        <button class="btn btn-ghost">取消</button>
        <button class="btn btn-primary">儲存</button>
      </div>
    </div>
  </div>
</body>
</html>
