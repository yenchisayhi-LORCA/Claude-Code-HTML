<!-- @dsCard height=288 -->
<style>
  html,body{margin:0;background:var(--paper);}
  .cover{position:relative;width:960px;height:288px;overflow:hidden;background:radial-gradient(700px 300px at 50% -20%,var(--paper-glow) 0%,var(--paper) 70%);}
  svg{position:absolute;inset:0;width:960px;height:288px;}
  .text{position:absolute;left:32px;bottom:28px;width:440px;}
  .name{font-family:var(--font-sans);font-weight:800;font-size:76px;line-height:1;color:var(--ink);margin:0;letter-spacing:.04em;}
  .tag{font-family:var(--font-sans);font-size:16px;color:var(--ink-soft);margin:14px 0 0;}
</style>
<div class="cover">
  <!-- 派生：
   色塊：四條由左到右逐漸升高的直條（薄荷、天藍、紫、琥珀），寬 56、間距 16，底緣對齊 y=264；card 色的圓角面板在後作為底。
   排列：直條集中在右半（x=520–800），像大螢幕上的長條圖，高度 80/136/104/184。
   圖樣：一條 chart-ly 虛線跨過直條上緣，代表去年同期。
   尺度：8px 倍數；直條頂端圓角 8px（pill 的縮小版）。 -->
  <svg viewBox="0 0 960 288" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="496" y="24" width="440" height="240" rx="18" fill="var(--card)" stroke="var(--line)"/>
    <rect x="528" y="184" width="56" height="80" rx="8" fill="var(--chart-1)"/>
    <rect x="600" y="128" width="56" height="136" rx="8" fill="var(--chart-2)"/>
    <rect x="672" y="160" width="56" height="104" rx="8" fill="var(--chart-3)"/>
    <rect x="744" y="80" width="56" height="184" rx="8" fill="var(--chart-4)"/>
    <path d="M520 168H816" stroke="var(--chart-ly)" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
    <circle cx="896" cy="56" r="7" fill="var(--pos)"/>
  </svg>
  <div class="text">
    <h1 class="name">大螢幕<br>看板</h1>
    <p class="tag">3 公尺外也看得清楚的營運數字</p>
  </div>
</div>
