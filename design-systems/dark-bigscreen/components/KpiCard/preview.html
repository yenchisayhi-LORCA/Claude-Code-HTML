<!-- @dsCard group="數字" height=270 subtitle="四張超大 KPI 卡（縮小 50%）" -->
<style>
  html,body{margin:0;background:var(--paper);font-family:var(--font-sans);color:var(--ink);}
  .stage{zoom:.5;width:1840px;padding:26px 40px;box-sizing:content-box;}
  .k4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);}
  .k{background:linear-gradient(180deg,var(--card-raised),var(--card));border:1px solid var(--line);border-radius:var(--radius-md);padding:18px var(--space-6);}
  .l{font-size:26px;color:var(--ink-soft);}
  .v{font-size:92px;font-weight:800;line-height:1.05;margin:2px 0;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--c);}
  .v small{font-size:36px;font-weight:600;color:var(--ink-soft);margin-left:6px;}
  .d{font-size:28px;font-weight:700;color:var(--pos);} .d.n{color:var(--neg);} .d span{color:var(--ink-soft);font-weight:400;margin-left:8px;font-size:22px;}
</style>
<div class="stage"><div class="k4">
  <div class="k" style="--c:var(--chart-1)"><div class="l">本月營收</div><div class="v">48.6<small>M</small></div><div class="d">▲ 6.2%<span>較去年同期</span></div></div>
  <div class="k" style="--c:var(--chart-2)"><div class="l">營業利益</div><div class="v">9.8<small>M</small></div><div class="d">▲ 4.8%<span>較去年同期</span></div></div>
  <div class="k" style="--c:var(--chart-3)"><div class="l">來客數</div><div class="v">12.4<small>萬</small></div><div class="d">▲ 2.1%<span>較上月</span></div></div>
  <div class="k" style="--c:var(--chart-4)"><div class="l">食材成本率</div><div class="v">37.8<small>%</small></div><div class="d n">▼ 0.8pt<span>較去年同期</span></div></div>
</div></div>
