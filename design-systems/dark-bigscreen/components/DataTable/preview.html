<style>
  html,body{margin:0;background:var(--paper);font-family:var(--font-sans);color:var(--ink);}
  .stage{zoom:.5;width:1200px;padding:26px 40px;box-sizing:content-box;}
  .p{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-3) var(--space-5);}
  h2{margin:0 0 6px;font-size:28px;font-weight:700;}
  table{width:100%;border-collapse:collapse;font-size:25px;font-variant-numeric:tabular-nums;}
  th{color:var(--ink-soft);font-weight:500;padding:6px 10px;text-align:center;border-bottom:1px solid var(--line);}
  td{padding:5px 10px;text-align:center;border-bottom:1px solid var(--line);}
  th.r,td.r{text-align:left;width:150px;color:var(--ink-soft);}
  .tg{display:inline-block;min-width:60px;padding:2px 14px;border-radius:var(--radius-pill);font-weight:800;}
  .tg.g{background:var(--pos-soft);color:var(--pos);} .tg.m{background:var(--gold-soft);color:var(--gold);} .tg.b{background:var(--neg-soft);color:var(--neg);}
  .n{color:var(--neg);}
</style>
